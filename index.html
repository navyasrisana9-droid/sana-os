<style>
/* Layout: one sticky header (script wordmark, day counter, pill tab strip) over a single 760px column.
   Sections sit on a dotted blush ground, separated by dashed lines; cards are stickers with a hard pink offset shadow. */
:root{
  --bg:#FFF1F6; --surface:#FFFFFF; --sunk:#FFE0EB; --fg:#3A1F2E; --muted:#7A5468; --line:#F6C9DB;
  --accent:#D6246E; --accent-deep:#A3174F; --on-accent:#FFFFFF; --shadow:#F8B7D0; --dot:#FBD3E3; --lav:#E9DDFF;
  --good:#17804F; --warn:#B26A00; --bad:#C23A3A;
  --f-display:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Yellowtail","Snell Roundhand",cursive;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1119; --surface:#2B1A25; --sunk:#3A2433; --fg:#FFE9F2; --muted:#D1A9BE; --line:#54303F;
  --accent:#FF6FAE; --accent-deep:#B93B7A; --on-accent:#2A0A18; --shadow:#6B2B48; --dot:#2B1A25; --lav:#3B2F57;
  --good:#4FD08F; --warn:#F0B14A; --bad:#FF7B7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1119; --surface:#2B1A25; --sunk:#3A2433; --fg:#FFE9F2; --muted:#D1A9BE; --line:#54303F;
  --accent:#FF6FAE; --accent-deep:#B93B7A; --on-accent:#2A0A18; --shadow:#6B2B48; --dot:#2B1A25; --lav:#3B2F57;
  --good:#4FD08F; --warn:#F0B14A; --bad:#FF7B7B; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--fg);font:15.5px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.shell{max-width:760px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
h2{font:600 29px/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h3{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h3::before{content:"✦ ";letter-spacing:0}
h4{font:600 17px/1.3 var(--f-display);margin:0 0 4px}
p{margin:0 0 8px;text-wrap:pretty}
small,.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:12px 0 10px;border-bottom:2px dashed var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.mark{font:400 38px/1 var(--f-script);color:var(--accent);letter-spacing:.01em}
.mark::after{content:" ✦";font:400 16px var(--f-body);vertical-align:super}
.dayc{font:500 12px var(--f-mono);color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:2px 10px}
.right{display:flex;align-items:center;gap:10px;flex-shrink:0}
#status{font:400 11px var(--f-mono);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:7px 15px;color:var(--fg);text-decoration:none;font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line);border-radius:99px}
.tabs a:hover{border-color:var(--accent)}

main{padding-top:6px}

.sec{padding:22px 0;border-bottom:2px dashed var(--line)}
.sec:last-child{border-bottom:0}
.head{padding:22px 0 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .sub{font:500 12px var(--f-mono);color:var(--muted);margin-top:6px}
.hi{font:400 34px/1.05 var(--f-script);color:var(--accent);margin:0 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label.f{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.fw{min-width:0}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 13px;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
input[type="checkbox"]{accent-color:var(--accent);width:20px;height:20px;padding:0}
textarea{resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}

.btn{font:700 14px var(--f-body);padding:10px 18px;border-radius:99px;border:2px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.chip{font:700 13px var(--f-body);padding:7px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;font-size:13px;text-decoration:underline}

.aff{font:500 22px/1.3 var(--f-display);text-wrap:balance;margin:0 0 12px}
.aff::before{content:"♡ ";color:var(--accent)}
.habits{display:grid;gap:10px}
.habit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:12px 16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.habit .box{width:28px;height:28px;border:2px solid var(--accent);border-radius:50%;position:relative;background:var(--surface)}
.habit.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.habit.on .box{background:var(--accent)}
.habit.on .box::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:var(--on-accent);font-size:15px;line-height:1}
.habit .hl strong{display:block;font-weight:700}
.habit .hl small{display:block}
.habit .st{font:500 12px var(--f-mono);color:var(--accent)}
.meter{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));border-radius:99px}
.mood{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mood button{padding:10px 4px;border:2px solid var(--line);background:var(--surface);border-radius:16px;cursor:pointer;font-size:13px;font-weight:700}
.mood button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.report{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:4px 4px 0 var(--shadow)}
.gl{font:600 46px/1 var(--f-display);color:var(--on-accent);background:var(--accent);width:86px;height:86px;border-radius:50%;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 4px 0 var(--accent-deep)}
.coachline{font-weight:700}
.note{background:var(--lav);border-radius:18px;padding:12px 16px;margin-top:12px}
.stat{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stat b{font:600 32px/1 var(--f-display)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px 6px 0;border-bottom:2px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:2px dashed var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.dots{display:flex;gap:5px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.dot.on{background:var(--accent)}
.dot.fut{opacity:.35}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.c{border-radius:5px;background:var(--sunk)}
.c.l1{background:color-mix(in srgb,var(--accent) 28%,var(--sunk))}
.c.l2{background:color-mix(in srgb,var(--accent) 50%,var(--sunk))}
.c.l3{background:color-mix(in srgb,var(--accent) 75%,var(--sunk))}
.c.l4{background:var(--accent)}
.c.fut{opacity:.4}.c.now{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;font:400 11px var(--f-mono);color:var(--muted)}
.legend .c{width:14px;height:14px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.li:last-child{border-bottom:0}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.li .t{min-width:0;overflow-wrap:anywhere}
.tick{width:26px;height:26px;border:2px solid var(--accent);border-radius:50%;background:var(--surface);cursor:pointer;position:relative}
.tick[aria-pressed="true"]{background:var(--accent)}
.tick[aria-pressed="true"]::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:var(--on-accent);font-size:14px;line-height:1}
.pill{font:500 11px var(--f-mono);padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.clock{font:500 clamp(56px,17vw,104px)/1 var(--f-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:4px 4px 0 var(--shadow)}
.msg{font:500 23px/1.3 var(--f-display);margin:18px 0 6px;min-height:2.6em;text-wrap:balance}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:6px}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick .btn{padding:18px 8px;font:600 22px var(--f-display);border-radius:22px;white-space:normal;box-shadow:3px 3px 0 var(--shadow)}
.pick .btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bar2{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.reply{display:grid;gap:14px}
.reply h3{margin-bottom:4px}
@media (prefers-reduced-motion:no-preference){.meter>i{transition:width .3s}.btn,.chip,.habit{transition:transform .1s,border-color .15s}.habit:active{transform:translate(2px,2px)}}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.35) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes swish{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.5;transform:scale(1.5) rotate(25deg)}}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),calc(var(--dy) + 170px)) rotate(var(--rot));opacity:0}}
@keyframes grow{from{clip-path:inset(0 100% 0 0 round 99px)}to{clip-path:inset(0 0 0 0 round 99px)}}
@keyframes cellin{from{transform:scale(.3)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(-6deg)}}
.cf{position:fixed;z-index:50;width:9px;height:14px;pointer-events:none;border-radius:3px;animation:burst 1.1s cubic-bezier(.2,.7,.3,1) forwards}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(90vw,420px);background:var(--fg);color:var(--bg);font:700 15px var(--f-body);padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;z-index:40;text-align:center;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){
 .mark::after{display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
 .enter{animation:fadeUp .35s both}
 .swish{animation:swish .5s both}
 .habit.just .box::after{animation:pop .45s both}
 .gl{animation:bob 3s ease-in-out infinite}
 .gl.pop{animation:pop .5s both,bob 3s .5s ease-in-out infinite}
 .meter>i{animation:grow .7s ease-out both}
 .c{animation:cellin .4s both;animation-delay:calc(var(--i,0)*3ms)}
 .btn.primary:hover,.chip:hover{transform:translateY(-2px) rotate(-1deg)}
 .tabs a{transition:transform .15s}
 .tabs a:hover{transform:translateY(-1px) rotate(-2deg)}
}
.mood button .e{font-size:22px;display:inline-block;line-height:1.3}
.habit .ic{display:inline-block;margin-right:2px}
.flame{display:inline-block}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.rem .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rem input[type="time"]{width:auto}
@media (max-width:560px){.rem{grid-template-columns:auto minmax(0,1fr)}.rem .acts{grid-column:1/-1}}
a.btn{text-decoration:none;display:inline-block;color:var(--fg)}
.fl{position:fixed;bottom:-40px;z-index:-1;opacity:.3;pointer-events:none;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(40deg)}}
@keyframes flick{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.25) rotate(6deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.3)}75%{transform:rotate(14deg) scale(1.3)}}
@media (prefers-reduced-motion:no-preference){
 .flame{animation:flick .8s ease-in-out infinite alternate}
 .mood button.wig .e{animation:wiggle .6s}
 .habit:hover .ic{animation:wiggle .6s}
 .tabs a:hover{animation:wiggle .5s}
}

/* switches, GPA sliders, tab editor */
.mcard{border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
.mcard>summary{cursor:pointer;font-weight:800;padding:4px 0}
.mcard[open]>summary{margin-bottom:12px}
.mcard .grid2{margin-bottom:12px}
.pick{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
input.sw{-webkit-appearance:none;appearance:none;width:46px;height:26px;padding:0;flex:none;border-radius:99px;background:var(--sunk);border:2px solid var(--line);position:relative;cursor:pointer}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-sizing:border-box}
input.sw:checked{background:var(--accent);border-color:var(--accent)}
input.sw:checked::after{left:22px;border-color:var(--accent-deep)}
.trow{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:560px){.trow{grid-template-columns:auto 56px minmax(0,1fr)}.trow>.row{grid-column:2/-1}}
.grow{margin-bottom:16px}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.gl2{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.grow.off .gl2{color:var(--muted)}
.gn{width:88px;flex:none;text-align:right;font-family:var(--f-mono);padding:6px 10px}
.gtrack{position:relative}
.gtrack::after{content:"";position:absolute;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--fg);opacity:.75;pointer-events:none;left:calc(12px + (100% - 24px)*var(--gf,0) - 1px)}
.gbox.nog .gtrack::after,.grow.isgoal .gtrack::after{display:none}
.gr{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;padding:0;background:transparent;border:0;cursor:pointer;--p:0%}
.gr::-webkit-slider-runnable-track{height:14px;border-radius:99px;box-shadow:0 0 0 2px var(--line);background:linear-gradient(90deg,var(--accent) var(--p),var(--sunk) var(--p))}
.gr::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:24px;height:24px;margin-top:-5px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 2px 0 var(--accent-deep)}
.gr::-moz-range-track{height:14px;border-radius:99px;box-shadow:0 0 0 2px var(--line);background:linear-gradient(90deg,var(--accent) var(--p),var(--sunk) var(--p))}
.gr::-moz-range-thumb{box-sizing:border-box;width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 2px 0 var(--accent-deep)}
.gr:disabled{opacity:.4;cursor:default}
.gr:focus-visible{outline-offset:4px;border-radius:99px}
</style>

<div class="shell">
  <header class="top">
    <div class="bar">
      <div class="brand"><span class="mark">Sana OS</span><span class="dayc" id="dayc"></span></div>

    </div>

  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

/* Lock-in */
function fmtT(s){return Math.floor(s/60)+":"+pad(s%60)}
function stepTimer(sec){lock.endAt=Date.now()+sec*1000;ensureIv()}
function lockNext(){
  var L=lock;
  if(L.step===1){if(L.dump.trim()){var dk="day-"+today(),dd=root(dk,true);dd.dump=(dd.dump?dd.dump+"\n\n":"")+L.dump.trim();save(dk)}}
  enterStep(nextStep(L.step+1));
}
var LNOTE={1:"Brain dump done. Now pick your one mission.",2:"Mission set. Reset your space.",3:"Reset done. Choose your timer."};
function ensureIv(){if(!lock.iv)lock.iv=setInterval(tick,500)}
function setText(id,t){var e=document.getElementById(id);if(e&&e.textContent!==t)e.textContent=t}
function tick(){
  var now=Date.now(),L=lock;
  if(L.step>=1&&L.step<=3){var left=Math.max(0,Math.ceil((L.endAt-now)/1000));setText("lk-time",fmtT(left));var n=document.getElementById("lk-next");if(n&&left===0)n.className="btn primary";if(left===0){var ns=L.step;lockNext();toast(LNOTE[ns]||"Next step.");try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}if(tab==="lockin"&&!settingsOpen)render();return}}
  else if(L.step===5){
    var rem=Math.max(0,Math.ceil((L.endAt-now)/1000)),el=L.total-rem;
    setText("lk-time",fmtT(rem));
    var b=document.getElementById("lk-bar");if(b)b.style.width=Math.min(100,el/L.total*100)+"%";
    setText("lk-el",fmtT(Math.max(0,Math.min(L.total,el)))+" done");setText("lk-pct",Math.min(100,Math.floor(el/L.total*100))+"%");
    var cps=CPS(L.dur),idx=-1;
    cps.forEach(function(c,i){if(el>=c[0]*60)idx=i});
    if(idx!==L.cp&&idx>=0){L.cp=idx;var mmx=MODE(L.mode),pn=cps[idx][1],pool=mmx.msgs.length?mmx.msgs:((mmx.ph&&mmx.ph[pn])||LMSG[pn]);var m=pool[Math.floor(Math.random()*pool.length)];L.log.push({min:cps[idx][0],m:m});setText("lk-msg",m);var ul=document.getElementById("lk-log");if(ul)ul.innerHTML=logHtml()}
    if(rem<=0)finishLock(false);
  }else{clearInterval(L.iv);L.iv=null}
}
function logHtml(){return lock.log.map(function(x){return '<li><span class="mono muted">min '+x.min+'</span> &nbsp;'+esc(x.m)+'</li>'}).join("")}
function finishLock(early){
  var L=lock;clearInterval(L.iv);L.iv=null;
  var el=Math.min(L.total,Math.round((Date.now()-L.startAt)/1000));
  var mins=early?Math.floor(el/60):Math.round(L.total/60);
  var key="day-"+today(),d=root(key,true);
  d.focus=(d.focus||0)+mins;d.sessions=d.sessions||[];d.sessions.push({mission:L.mission,min:mins,res:""});
  save(key);L.done=mins;L.step=6;if(!early)confetti(innerWidth/2,innerHeight/3,70);
  if(tab==="lockin"&&!settingsOpen)render();
}

  }else{

/* Monthly */
function mstats(m){return rangeStats(m+"-01",lastOfMonth(m))}
function delta(a,b,fmt,inv){if(b==null||a==null)return '<span class="muted">–</span>';var d=a-b;if(Math.abs(d)<1e-9)return '<span class="muted">no change</span>';var good=inv?d<0:d>0;return '<span class="'+(good?'good':'bad')+'">'+(d>0?'+':'−')+fmt(Math.abs(d))+'</span>'}
function vMonth(){
  var doc="rev-mo-"+mo,rv=root(doc,false),a=mstats(mo),b=mstats(shiftMonth(mo,-1));
  var hasEx=S.settings.habits.some(function(h){return h.id==="ex"});
  var rate=function(path,label){var v=getp(rv,path)||0;return '<div class="row" style="justify-content:space-between;margin-bottom:10px"><span>'+label+'</span><div class="rate" role="group" aria-label="'+label+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-act="rate" data-doc="'+doc+'" data-path="'+path+'" data-v="'+n+'" aria-pressed="'+(v===n)+'">'+n+'</button>'}).join("")+'</div></div>'};
  var nav='<div class="row"><button class="btn sm" type="button" data-act="mnav" data-v="-1" aria-label="Previous month">&larr;</button><button class="btn sm" type="button" data-act="mnav" data-v="0">This month</button><button class="btn sm" type="button" data-act="mnav" data-v="1" aria-label="Next month">&rarr;</button></div>';
  var rowsT=[
    ["Habit consistency",pc(a.pct),pc(b.pct),delta(a.pct*100,b.days?b.pct*100:null,function(x){return Math.round(x)+" pts"})],
    ["Days logged",a.logged+" of "+a.days,b.logged+" of "+b.days,delta(a.logged,b.days?b.logged:null,function(x){return x})],
    ["Average mood",a.mood?a.mood.toFixed(1):"–",b.mood?b.mood.toFixed(1):"–",delta(a.mood,b.mood,function(x){return x.toFixed(1)})],
    ["Focus hours",(a.focus/60).toFixed(1),(b.focus/60).toFixed(1),delta(a.focus/60,b.days?b.focus/60:null,function(x){return x.toFixed(1)})]
  ];
  if(hasEx)rowsT.push(["Exercise days",String(a.ph.ex||0),String(b.ph.ex||0),delta(a.ph.ex||0,b.days?(b.ph.ex||0):null,function(x){return x})]);

/* Semester */
/* GPA sliders: one row per Baseline / semester / Goal. A switch turns a value on or off, the bar sets it. */
var GROWS=function(){

function gval(doc,path){var v=parseFloat(getp(root(doc,false),path));return isNaN(v)?null:Math.max(0,Math.min(4,v))}

  SEMS.forEach(function(s){var g=gval("rev-sem-"+s.id,"gpa");if(g!=null)last=g});

  if(goal!=null){var g=goal-last;t+=g<=0?" · goal reached":" · "+g.toFixed(2)+" to go"}

}

    +'<div class="gtrack"><input type="range" class="gr" id="gr-'+i+'" min="0" max="4" step="0.01" '+data+' value="'+val.toFixed(2)+'" style="--p:'+(val/4*100).toFixed(1)+'%"'+(on?'':' disabled')+'></div></div>';

function fmtTime(t){var p=String(t||"").split(":"),h=+p[0],m=+p[1];if(isNaN(h)||isNaN(m))return "";return new Date(2000,0,1,h,m).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
function nextUp(){

}
function gcal(r){
  var p=String(r.time||"").split(":"),hh=+p[0],mm=+p[1];if(isNaN(hh)||isNaN(mm))return "";
  var n=new Date(),t=today(),base=t<START?START:t;
  if(base===t&&(n.getHours()>hh||(n.getHours()===hh&&n.getMinutes()>=mm)))base=addDays(base,1);
  if(r.weekly){while(parse(base).getDay()!==0)base=addDays(base,1)}
  var left=diff(base,END);if(left<0)return "";
  var cnt=r.weekly?Math.floor(left/7)+1:left+1;
  var b=parse(base);b.setHours(hh,mm,0,0);var e=new Date(b.getTime()+15*60000);
  var f=function(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"};
  var tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(x){}
  var rule="RRULE:FREQ="+(r.weekly?"WEEKLY;BYDAY=SU":"DAILY")+";COUNT="+cnt;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent((r.icon||"")+" "+r.label)+"&details="+encodeURIComponent(r.note||"")+"&dates="+f(b)+"/"+f(e)+(tz?"&ctz="+encodeURIComponent(tz):"")+"&recur="+encodeURIComponent(rule);
}

  n:["Write one sentence for what's bothering you most, then one tiny action for it, and do it for ten minutes.","Drink water, stand up, stretch for two minutes, and tick the easiest habit on your list."],
  l:["Use the daily review to spot what keeps repeating, and fix that pattern in your Sunday review.","Keep a steady routine for sleep, water, movement and one study block. Boring consistency fixes a lot."],
  a:["Proud of you for opening this app. Now do one thing.","Small steps still leave footprints."]}
];
function runCoach(){
  var txt=coach.text.trim();if(!txt)return;
  coach.err="";coach.res=null;coach.crisis=false;
  if(CRISIS.test(txt)){coach.crisis=true;render();return}
  var th=CTHEMES.filter(function(t){return t.re.test(txt)})[0],n=txt.length+new Date().getDate();
  var pk=function(a,k){return a[(n+k)%a.length]};
  var d=dayOf(home()),miss=coach.inc?S.settings.habits.filter(function(h){return h.label&&!d.h[h.id]}):[];
  var nowStep=pk(th.n,2);
  if(miss.length&&th.n!==CTHEMES[0].n)nowStep+=' Then tick "'+miss[0].label+'" today.';
  coach.res={validate:pk(th.v,0),real_problem:pk(th.r,1),do_now:nowStep,long_term:pk(th.l,3),line:pk(th.a,4),safety:SOFTSAFE.test(txt)};
  render();
}

    var num=function(f,label,def,lo,hi){var v=(((S.settings.modes||{})[k])||{})[f],pa=pre+f;return '<div class="fw"><label class="f" for="'+fid("settings",pa)+'">'+esc(label)+'</label><input id="'+fid("settings",pa)+'" type="number" inputmode="numeric" min="'+lo+'" max="'+hi+'" step="1" data-doc="settings" data-path="'+pa+'" placeholder="'+def+'" value="'+esc(v==null?"":v)+'"></div>'};
    return '<details class="mcard"><summary>'+esc(MODE(k).n)+'</summary><div class="grid2">'

      +num("dump","Brain dump (minutes)",b.dump,0,15)+num("mission","Mission (minutes)",b.mission,0,15)+num("reset","Environment reset (minutes)",b.reset,0,15)
      +'</div>'+lab("settings",pre+"msgs","Check-in messages","One per line. Empty uses this mode's built-in lines.",4)+'</details>'}).join("")

  +hs.map(function(h,i){return '<div class="grid2" style="grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) auto;align-items:center;margin-bottom:8px">'+fld("settings","habits."+i+".icon",hicon(h))+fld("settings","habits."+i+".label","Habit")+fld("settings","habits."+i+".detail","Detail, e.g. 15 minutes")+'<button class="x" type="button" data-act="hrem" data-i="'+i+'">Remove</button></div>'}).join("")
  +'<button class="btn sm" type="button" data-act="hadd">Add a habit</button></section>'

/* ---------- render ---------- */
function renderNav(){
  rebuildTabs();
  if(!TABS.some(function(t){return t[0]===tab}))tab=TABS[0][0];
  $("#tabs").innerHTML=TABS.map(function(t){return '<a href="#'+t[0]+'"'+(!settingsOpen&&tab===t[0]?' aria-current="page"':'')+'>'+esc(t[1])+'</a>'}).join("");
}
function render(){
  renderNav();
  var idx=diff(START,today())+1;
  $("#dayc").textContent=idx<1?"Starts "+fmtShort(START):idx>TOTAL?"Plan complete":"Day "+idx+" of "+TOTAL;
  $("#btn-settings").textContent=settingsOpen?"Close":"Settings";
  var views={today:vToday,lockin:vLock,week:vWeek,month:vMonth,term:vTerm,progress:vProgress,plan:vPlan,coach:vCoach,remind:vRemind};
  $("#view").innerHTML=settingsOpen?vSettings():views[tab]();
  setStatus();
}
function route(){
  rebuildTabs();
  var h=(location.hash||"").replace("#","");
  if(TABS.some(function(t){return t[0]===h})){tab=h;settingsOpen=false}
  render();window.scrollTo(0,0);var vw=$("#view");vw.classList.remove("enter");void vw.offsetWidth;vw.classList.add("enter");
}
window.addEventListener("hashchange",route);

/* ---------- events ---------- */
function act(a,b){
  var v=b.dataset.v,id=b.dataset.id;
  switch(a){
    case "settings":settingsOpen=!settingsOpen;break;
    case "habit":var d=root("day-"+cur,true);d.h[id]=!d.h[id];save("day-"+cur);if(d.h[id]){justId=id;try{var rc=b.getBoundingClientRect(),sweep=S.settings.habits.every(function(h){return d.h[h.id]});if(sweep){confetti(innerWidth/2,innerHeight/3,80);toast(pick(ALLDONE)+" 🎉")}else{confetti(rc.left+28,rc.top+rc.height/2,18);toast(pick(CHEER)+" "+pick(EMO))}}catch(x){}}break;
    case "mood":var d2=root("day-"+cur,true);d2.mood=d2.mood===+v?0:+v;save("day-"+cur);justMood=true;break;
    case "dnav":cur=addDays(cur,+v);if(cur>END)cur=END;if(cur<START)cur=START;break;
    case "dtoday":cur=home();break;
    case "aff":affI=Math.floor(Math.random()*500);affFx=true;break;
    case "golock":location.hash="lockin";return;
    case "wnav":wkEnd=addDays(wkEnd,+v);break;
    case "wtoday":wkEnd=weekEnd(today());break;
    case "wpull":var r=weekRange(wkEnd),ws=[];for(var s=r.from;s<=r.to;s=addDays(s,1)){var w=(S.days[s]||{}).wins;if(w&&w.trim())ws.push("- "+fmtShort(s)+": "+w.trim())}setPath("rev-wk-"+wkEnd,"wins",ws.join("\n"));break;
    case "wscore":setPath("rev-wk-"+wkEnd,"score",+v);break;
    case "mnav":mo=+v===0?monthOf(today()):shiftMonth(mo,+v);break;
    case "rate":setPath(b.dataset.doc,b.dataset.path,+v);break;
    case "semset":semI=+v;break;
    case "tmove":var tl=ensureTabs(),ti=+b.dataset.i,tj=ti+(+v);if(tj>=0&&tj<tl.length){var tt=tl[ti];tl[ti]=tl[tj];tl[tj]=tt;save("settings")}break;
    case "mreset":S.settings.modes={};save("settings");break;
    case "treset":S.settings.tabs=defTabs();S.settings.semNames={};save("settings");break;
    case "lmode":lock.mode=v;lock.dur=MODE(v).d;break;
    case "lstart0":lock.step=1;lock.dump="";lock.mission="";lock.env=[false,false,false,false,false];lock.log=[];lock.cp=-1;lock.dur=MODE(lock.mode).d;enterStep(nextStep(1));break;
    case "lnext":lockNext();break;
    case "lback":var ps=lock.step<=1?0:prevStep(lock.step-1);if(ps===0)lock.step=0;else enterStep(ps);break;
    case "pickm":lock.mission=b.dataset.t;break;
    case "env":lock.env[+b.dataset.i]=!lock.env[+b.dataset.i];break;
    case "lgo":lock.dur=+(b.dataset.d||v);if(!(lock.dur>0))lock.dur=25;lock.total=lock.dur*60;lock.startAt=Date.now();lock.endAt=lock.startAt+lock.total*1000;lock.cp=-1;lock.log=[];lock.step=5;ensureIv();setTimeout(tick,0);break;
    case "lstop":finishLock(true);return;
    case "lres":if(v==="yes"){confetti(innerWidth/2,innerHeight/3,70);toast(pick(ALLDONE)+" 🎉")}var dr=root("day-"+today(),true);if(dr.sessions&&dr.sessions.length){dr.sessions[dr.sessions.length-1].res=v;save("day-"+today())}lock.step=0;location.hash="today";return;
    case "lreset":lock.step=0;break;
    case "atoggle":var nd=false;S.lists.assignments.forEach(function(x){if(x.id===id){x.done=!x.done;nd=x.done}});save("list-assignments");if(nd){var r2=b.getBoundingClientRect();confetti(r2.left+13,r2.top+13,22);toast("Crossed off. Future Sana says thank you.")}break;
    case "adel":S.lists.assignments=S.lists.assignments.filter(function(x){return x.id!==id});save("list-assignments");break;
    case "mdel":S.lists.money=S.lists.money.filter(function(x){return x.id!==id});save("list-money");break;
    case "jdel":S.lists.jobs=S.lists.jobs.filter(function(x){return x.id!==id});save("list-jobs");break;
    case "hadd":S.settings.habits.push({id:"h"+uid8(),icon:"✨",label:"",detail:""});save("settings");break;
    case "hrem":S.settings.habits.splice(+b.dataset.i,1);save("settings");break;
    case "affdel":S.settings.myAffs.splice(+b.dataset.i,1);save("settings");break;
    case "coach":runCoach();return;
    case "export":try{var bk=JSON.stringify({app:"sana-os",v:1,settings:S.settings,days:S.days,rev:S.rev,lists:S.lists,lts:S.lts},null,1),bl=new Blob([bk],{type:"application/json"}),u=URL.createObjectURL(bl),an=document.createElement("a");an.href=u;an.download="sana-os-backup-"+today()+".json";document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast("Backup downloaded ✨")}catch(x){toast("Could not make the backup.")}return;
    case "copyrem":(navigator.clipboard?navigator.clipboard.writeText(remText()):Promise.reject()).then(function(){toast("Copied ✨")},function(){toast("Could not copy. Select the text and copy it.")});return;
  }
  render();
}
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b&&!b.disabled){try{act(b.dataset.act,b)}catch(err){toast("Something glitched: "+((err&&err.message)||err));try{render()}catch(x){}}}});
document.addEventListener("input",function(e){
  var t=e.target,ds=t.dataset||{};
  if(ds.gdoc&&(t.type==="range"||t.type==="number")){gpaInput(t)}
  else if(ds.doc&&t.type!=="checkbox"){setPath(ds.doc,ds.path,t.value);if(ds.doc==="settings"&&ds.path.indexOf("tabs.")===0)renderNav()}
  else if(ds.lock){lock[ds.lock]=t.value}
  else if(ds.coach==="text"){coach.text=t.value}
});
document.addEventListener("change",function(e){
  var t=e.target,ds=t.dataset||{};
  if(ds.gtog){gpaToggle(t)}
  else if(ds.chg==="import"){var f=t.files&&t.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||typeof o!=="object"||!(o.days||o.settings||o.rev||o.lists))throw 0;adopt(o);persistLocal();setStatus();render();toast("Backup restored ✨")}catch(x){toast("That file is not a Sana OS backup.")}};fr.onerror=function(){toast("Could not read that file.")};fr.readAsText(f);t.value=""}
  else if(ds.chg==="jump"){if(t.value){cur=t.value>END?END:(t.value<START?START:t.value);render()}}
  else if(ds.coach==="inc"){coach.inc=t.checked}
  else if(ds.doc&&t.type==="checkbox"){setPath(ds.doc,ds.path,t.checked);if(ds.doc==="settings"&&ds.path.indexOf("tabs.")===0)renderNav()}
  else if(ds.doc&&t.type==="time"){render()}
  else if(ds.chg==="jstatus"){S.lists.jobs.forEach(function(j){if(j.id===ds.id)j.status=t.value});save("list-jobs")}
  else if(ds.doc&&t.tagName==="SELECT"){setPath(ds.doc,ds.path,t.value);if(ds.doc.indexOf("rev-sem-")===0)render()}
  else if(ds.doc&&t.type==="number"&&ds.doc.indexOf("rev-sem-")===0)render();
});
document.addEventListener("submit",function(e){
  var f=e.target.dataset&&e.target.dataset.form;if(!f)return;
  e.preventDefault();
  var g=function(i){return document.getElementById(i).value.trim()};
  if(f==="assign"){var ti=g("a-title");if(!ti)return;S.lists.assignments.push({id:uid8(),title:ti,course:g("a-course"),due:g("a-due"),done:false});save("list-assignments")}
  else if(f==="money"){var am=parseFloat(g("m-amt"));if(isNaN(am)||am<=0)return;var sg=+document.getElementById("m-type").value;S.lists.money.push({id:uid8(),date:today(),label:g("m-label"),amt:sg*am});save("list-money")}
  else if(f==="job"){var co=g("j-co");if(!co)return;S.lists.jobs.push({id:uid8(),co:co,role:g("j-role"),status:"Interested"});save("list-jobs")}
  else if(f==="aff"){var a=g("aff-new");if(!a)return;S.settings.myAffs=(S.settings.myAffs||[]).concat([a]);save("settings")}
  render();
});

/* ---------- boot ---------- */
loadLocal();
rebuildTabs();
(function(){var h=(location.hash||"").replace("#","");if(TABS.some(function(t){return t[0]===h}))tab=h})();
render();
if(!RM){var fe=["💖","✨","🌸","🎀","⭐","💅"],fr=document.createDocumentFragment();for(var q=0;q<9;q++){var sp=document.createElement("span");sp.className="fl";sp.textContent=fe[q%fe.length];sp.style.cssText="left:"+(4+q*11)+"%;font-size:"+(16+Math.random()*12).toFixed(0)+"px;animation-duration:"+(16+Math.random()*12).toFixed(0)+"s;animation-delay:-"+(Math.random()*20).toFixed(0)+"s";fr.appendChild(sp)}document.body.appendChild(fr)}
})();
</script>
